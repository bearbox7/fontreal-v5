name: Read-only FontReal Render and Pages preview diagnostics
on:
  push:
    branches: [chore/check-fontreal-render-20261106]
    paths: [.github/workflows/diagnose-fontreal-preview.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test existing Render /api/health (no changes)
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sSL --retry 2 --retry-all-errors --retry-delay 5 --max-time 120 \
            -o /tmp/fontreal-health.json -w '%{http_code}' \
            "https://fontreal-v5.onrender.com/api/health") || { echo "Render endpoint is unreachable"; exit 1; }
          echo "Render HTTP status: $code"
          if [[ "$code" != "200" ]]; then echo "Render health endpoint returned a non-200 status"; exit 1; fi
          python3 - <<'PY'
          import json
          with open("/tmp/fontreal-health.json",encoding="utf8") as f: d=json.load(f)
          if d.get("ok") is not True or d.get("app")!="FontReal V5":
              raise SystemExit("Unexpected health response (not FontReal V5)")
          print("Render FontReal V5 health: VERIFIED")
          print("Glyph editor available:", bool(d.get("glyphEditor")))
          PY
      - name: Inspect Cloudflare Pages preview binding safely (read only)
        if: success()
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_ACCOUNT" || -z "$CF_TOKEN" ]]; then echo "Cloudflare secrets absent"; exit 1; fi
          curl -fsSL --max-time 45 --retry 2 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/fontreal" \
            -o /tmp/fontreal-project.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/fontreal-project.json",encoding="utf8"))
          p=d.get("result") or {}
          if not d.get("success") or p.get("name")!="fontreal":
              raise SystemExit("Wrong account or Pages project")
          assert p.get("production_branch")=="main", "Production branch mismatch"
          cfg=p.get("deployment_configs") or {}
          for env in ("preview","production"):
              v=((cfg.get(env) or {}).get("env_vars") or {}).get("FONTREAL_BACKEND_ORIGIN")
              value=(v or {}).get("value") if isinstance(v,dict) else None
              print(f"Cloudflare {env} backend variable present:", bool(v))
              print(f"Cloudflare {env} backend is previously verified Render origin:", value=="https://fontreal-v5.onrender.com")
          print("Read-only diagnostics complete. No Pages deployments or settings changed.")
          PY
